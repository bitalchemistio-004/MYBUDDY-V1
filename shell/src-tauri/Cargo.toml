[package]
name = "mbuddy-shell"
version = "0.1.0"
license = "GPL-3.0-only"
description = "MBUDDY desktop shell: tray, notifications, backend supervision"
edition = "2021"

[lib]
name = "mbuddy_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# Keeps the local build folder small (it reached 9.4 GB): line numbers for MBUDDY's own code in crash messages,
# no debug info for the ~400 libraries, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
