<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Every buddy, dressed</title>
<style>
  body { margin: 0; padding: 16px; background: #0b0b0d; color: #eee; font: 13px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; }
  figure { margin: 0; background: #131318; border: 1px solid #2b2b2b; border-radius: 8px; padding: 8px; }
  figcaption { font-size: 12px; color: #aaa; margin-top: 4px; text-align: center; }
  svg { width: 300px; height: 225px; display: block; background: #3b3f4d; border-radius: 6px; }
</style></head><body>
<h1>Developer preview: each buddy with one decoration per place, drawn by the app's own placement code (wardrobe-fit.js, wardrobe-pixel.js). ?surface=room|app|peek &amp; ?pick=0|1|2 chooses which item of each place.</h1>
<div class="row" id="row"></div>
<script type="module">
import { placements } from "../js/buddy/wardrobe-fit.js";
import { PIXEL_IDS, pixelGroup } from "../js/buddy/wardrobe-pixel.js";
const params = new URLSearchParams(location.search), surface = params.get("surface") || "room", pick = +(params.get("pick") || 0);
const CHARS = ["blink", "void", "glitch", "cinder", "oracle"], SLOTS = ["crown", "eyes", "neck", "back", "hand", "aura"];
const COL = { blink: "#f2f2f0", void: "#a98cff", glitch: "#5fd0e6", cinder: "#ff8a3d", oracle: "#e8c15a" };
// which ids belong to whom: the table of fits says so
const { ITEM_FIT } = await import("../js/buddy/wardrobe-fit.js");
const sheet = new URL("../assets/buddy/chars/", import.meta.url);
const row = document.getElementById("row");
for (const c of CHARS) {
  const mine = Object.keys(ITEM_FIT[c]), worn = {};
  for (const s of SLOTS) { const list = mine.filter((k) => k.startsWith(s + "-")); const k = list[pick % Math.max(1, list.length)]; if (k) worn[s] = k.slice(s.length + 1); }
  const items = placements(c, worn, surface, { styles: Object.fromEntries(SLOTS.map((s) => [s, "pixel"])), ink: "char" });
  const layer = (name) => items.filter((p) => p.layer === name).map((p) => `<g style="--wd-ink:${COL[c]}" transform="translate(${p.x} ${p.y}) scale(${p.k})">${pixelGroup(`${p.slot}-${p.id}`)}</g>`).join("");
  const fig = document.createElement("figure");
  fig.innerHTML = `<svg viewBox="0 0 320 240">${layer("back")}<svg viewBox="0 0 320 240" width="320" height="240"><image href="${new URL(c + "/idle.webp", sheet).href}" width="2560" height="1440"/></svg>${layer("front")}</svg>
    <figcaption>${c}: ${SLOTS.map((s) => worn[s] || "-").join(", ")}</figcaption>`;
  row.append(fig);
}
</script></body></html>
