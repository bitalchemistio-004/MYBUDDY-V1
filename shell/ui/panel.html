<!doctype html>
<html lang="en" data-theme="clay">
<head>
<meta charset="utf-8">
<title>MBUDDY</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/cards.css">
<style>
  /* The quick panel (S75): opened by clicking the buddy, closed by a click
     outside or Esc. Solid surface, no blur: it's small and short-lived. */
  html, body { background: transparent !important; height: 100%; }
  body { padding: 8px; box-sizing: border-box; }
  .panel { height: 100%; display: flex; flex-direction: column; background: var(--surface-1); border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg); box-shadow: 0 16px 40px var(--shadow); overflow: hidden; animation: pin .32s cubic-bezier(.34, 1.3, .64, 1); }
  @keyframes pin { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s4) var(--s3); }
  .av { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; padding: 3px;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .17), rgba(255, 255, 255, .05) 70%, transparent); }
  .head b { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .head .who { flex: 1; min-width: 0; }
  .head b { display: block; font-size: var(--fs-body); }
  .head small { font-size: var(--fs-caption); color: var(--text-3); }
  .mic { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-caption); color: var(--text-2); }
  .tabs { display: flex; gap: 4px; padding: 3px; margin: 0 var(--s4); border-radius: var(--radius-pill); background: var(--surface-2); }
  .tabs button { flex: 1; min-height: 34px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-2);
    font-weight: 600; font-size: var(--fs-small); cursor: pointer; transition: background var(--t-fast), color var(--t-fast); }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--surface-1); }
  .body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s3) var(--s4); scrollbar-width: thin; }
  .msgs { display: flex; flex-direction: column; gap: var(--s2); }
  .m { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .m.me { align-self: flex-start; background: var(--accent-soft); border-bottom-left-radius: 4px; }
  .m.you { align-self: flex-end; background: var(--surface-3); border-bottom-right-radius: 4px; }
  .ask { margin-top: var(--s2); padding: var(--s3); border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .composer { display: flex; gap: var(--s2); align-items: center; margin: 0 var(--s3) var(--s3); padding: 4px 4px 4px var(--s4);
    border-radius: var(--radius-pill); background: var(--surface-2); border: 1px solid var(--line-strong); }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer input { flex: 1; border: 0; background: transparent; outline: none; min-height: 38px; }
  .picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s2) 4px; min-width: 0; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: var(--fs-caption); font-weight: 600; }
  .pick:hover { background: var(--surface-3); }
  .pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .pick .st { width: min(60px, 100%); aspect-ratio: 1; overflow: hidden; }
  .tool { display: flex; align-items: center; gap: var(--s3); padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .tool:first-child { border-top: 0; }
  .tool span { flex: 1; }
  .state { font-size: var(--fs-caption); font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-3); white-space: nowrap; }
  .state.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .state.asks { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .foot { padding: 0 var(--s4) var(--s3); }
  .foot button { border: 0; background: transparent; color: var(--accent-text); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: var(--fs-small); }
  /* Now: what it last said, the PC, the job, the music, the next reminders */
  .now { display: grid; gap: 10px; }
  .now .say { margin: 0; display: flex; align-items: center; min-height: 2.6em; font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .now .say::before { content: ""; flex: none; width: 4px; align-self: stretch; margin-right: 9px; border-radius: 4px; background: var(--accent); }
  .now .say.quiet { color: var(--text-2); font-weight: 700; }
  .now .say span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .now .lcard { padding: 11px 12px; background: var(--surface-2); border-color: transparent; }
  .now .lcard .pipe span:not(.on):not(.ok), .now .lcard .rem, .now .pcs span { background: var(--surface-3); }
  .now .lcard .pipe span.ok { background: var(--surface-1); }
  .now .pcs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
  .now .pcs span { text-align: center; padding: 5px 4px; font-size: 10.5px; }
  .now .pcs b { font-size: 14px; }
  .now .lcard .appic { width: 38px; height: 38px; border-radius: 11px; font-size: 19px; }
  .now .lcard .wk-task { font-size: 15px; }
  .now .lcard .wk-pct { font-size: 20px; }
  .now .lcard .wk-pct.small { font-size: 12px; }
  .now .lcard .prog { height: 8px; }
  .now .lcard .disc, .now .lcard .vinyl { width: 78px; height: 78px; }
  .now .lcard .vinyl i { width: 30px; height: 30px; }
  .now .lcard .arm { left: 64px; height: 44px; }
  .now .lcard .trk b { font-size: 15px; }
  .now .lcard .cal { grid-template-columns: repeat(7, 22px); gap: 2px; font-size: 11px; }
  .now .lcard .cal span { height: 22px; border-radius: 7px; }
  .now .lcard .clock { width: 72px; height: 72px; }
  .now .lcard .rems { min-width: 100%; }
  .now .lcard .rem { flex-wrap: wrap; }
  .now .lcard .frm { grid-template-columns: minmax(0, 1fr); }
  .sub { font-size: var(--fs-caption); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: var(--s3) 0 var(--s2); }
</style>
</head>
<body>
<div class="panel" role="dialog" aria-label="MBUDDY quick panel">
  <div class="head">
    <div class="av" id="av"></div>
    <div class="who"><b id="name">MBUDDY</b><small id="state">…</small></div>
    <div class="mic">Mic <button class="switch" id="mic" type="button" role="switch" aria-checked="true" aria-label="Microphone"></button></div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="now" aria-selected="true">Now</button>
    <button type="button" role="tab" data-tab="chat" aria-selected="false">Chat</button>
    <button type="button" role="tab" data-tab="buddy" aria-selected="false">Buddy</button>
    <button type="button" role="tab" data-tab="tools" aria-selected="false">Abilities</button>
  </div>
  <div class="body" id="body"></div>
  <form class="composer" id="form">
    <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden">Message MBUDDY</label>
    <input id="input" autocomplete="off" placeholder="Ask or tell MBUDDY something" maxlength="1000">
    <button class="btn accent icon" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="foot"><button type="button" id="full">Open the full MBUDDY app</button></div>
</div>
<script type="module" src="js/panel.js"></script>
</body>
</html>
