# Keeps dependencies from going stale quietly: a pull request is opened when a new version is out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
