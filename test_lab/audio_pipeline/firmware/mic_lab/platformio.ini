; MBUDDY audio-lab test firmware — a standalone project, separate from
; firmware/mbuddy. Board settings are copied from that project so the two
; boot identically on the same ESP32-S3-WROOM-1 N16R8 module.
;
;   Build:   pio run
;   Flash:   pio run -t upload          (edit upload_port if your board is not on COM9)
;   Monitor: pio device monitor
;
; Re-flash firmware/mbuddy afterwards to return the robot to normal operation.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags = -DBOARD_HAS_PSRAM
  -DLAB_OTA_PASSWORD=\"mbuddy-lab\"
framework = arduino
monitor_speed = 115200
upload_port = COM9
lib_deps =
  links2004/WebSockets
  tzapu/WiFiManager
  olikraus/U8g2

; Over-the-air update (after the first USB flash of fw 4 or newer):
;   pio run -e ota -t upload --upload-port <board IP>      (the IP is shown in the lab page header)
; The password is a shared default: change LAB_OTA_PASSWORD above AND --auth below together.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = mbuddy-lab.local
upload_flags =
  --auth=mbuddy-lab
