[env:esp32-s3-devkitc-1]
platform = espressif32
; Base board is just a generic ESP32-S3 chip target — every pin in
; MBUDDY.ino was deliberately chosen clear of GPIO26-37 (the range that
; varies by PSRAM config), so it's safe regardless. The settings below
; override its defaults (which assume an 8MB-flash, no-PSRAM module) to
; match what esptool actually reported flashing this specific board:
; "ESP32-S3 (QFN56), Embedded PSRAM 8MB (AP_3v3)" — the signature of a
; genuine ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB *octal* PSRAM).
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags = -DBOARD_HAS_PSRAM
framework = arduino
monitor_speed = 115200
upload_port = COM9
lib_deps =
  olikraus/U8g2
  links2004/WebSockets
  tzapu/WiFiManager

; Over-the-air update (no cable), once this firmware is on the board:
;   pio run -e ota -t upload --upload-port <board IP>
; The password is a shared default: change MBUDDY_OTA_PASSWORD in MBUDDY.ino AND --auth here together.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = mbuddy.local
upload_flags =
  --auth=mbuddy-ota
